<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Credit Card</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&family=Space+Mono&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0f0c29;  
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
        }

        /* Animated background blobs for the glass effect to show through */
        .color-blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            border-radius: 50%;
            animation: float 8s ease-in-out infinite;
        }

        .blob-1 {
            top: 15%;
            left: 25%;
            width: 300px;
            height: 300px;
            background: #ff007f;
            animation-delay: 0s;
        }

        .blob-2 {
            bottom: 15%;
            right: 25%;
            width: 350px;
            height: 350px;
            background: #00f0ff;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }

        /* The Glass Card */
        .card {
            width: 400px;
            height: 250px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            box-shadow: 20px 20px 50px rgba(0, 0, 0, 0.5);
            padding: 30px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px) rotateX(5deg) rotateY(5deg);
            box-shadow: 30px 30px 60px rgba(0, 0, 0, 0.6);
        }

        /* Header containing Logo and Chip */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            font-style: italic;
        }

        .chip {
            width: 50px;
            height: 35px;
            background: linear-gradient(135deg, #e5b651 0%, #ffe694 100%);
            border-radius: 5px;
            position: relative;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
        }

        /* Card Details */
        .card-number {
            font-family: 'Space Mono', monospace;
            font-size: 26px;
            letter-spacing: 4px;
            margin-top: 20px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .detail-group {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        /* Responsive styling for smaller screens */
        @media (max-width: 480px) {
            .card {
                width: 320px;
                height: 200px;
                padding: 20px;
            }
            .card-number {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="color-blob blob-1"></div>
    <div class="color-blob blob-2"></div>

    <div class="card">
        <div class="card-header">
            <div class="logo">VISA</div>
            <div class="chip"></div>
        </div>
        
        <div class="card-number">
            4000 1234 5678 9010
        </div>
        
        <div class="card-footer">
            <div class="detail-group">
                <span class="detail-label">Card Holder</span>
                <span class="detail-value">YASH KRISHNAN</span>
            </div>
            <div class="detail-group">
                <span class="detail-label">Expires</span>
                <span class="detail-value">12/28</span>
            </div>
        </div>
    </div>

</body>
</html>
