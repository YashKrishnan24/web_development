<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Neon Clock</title>
    <style>
        :root {
            --neon-color: #0ff;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        .clock-container {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--neon-color);
            border-radius: 15px;
            padding: 20px 40px;
            box-shadow: 0 0 20px var(--neon-color), inset 0 0 20px var(--neon-color);
            transition: all 0.5s ease;
        }

        .time {
            font-size: 5rem;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-color), 0 0 20px var(--neon-color), 0 0 40px var(--neon-color);
            letter-spacing: 5px;
            font-weight: bold;
        }

        .controls {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px;
            border-radius: 30px;
        }

        .color-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .color-btn:hover {
            transform: scale(1.2);
        }

        .btn-cyan { background-color: #0ff; box-shadow: 0 0 15px #0ff; }
        .btn-magenta { background-color: #f0f; box-shadow: 0 0 15px #f0f; }
        .btn-green { background-color: #0f0; box-shadow: 0 0 15px #0f0; }
        .btn-yellow { background-color: #ff0; box-shadow: 0 0 15px #ff0; }
        .btn-orange { background-color: #ff8c00; box-shadow: 0 0 15px #ff8c00; }
    </style>
</head>
<body>

    <div class="clock-container">
        <div class="time" id="clock">00:00:00</div>
    </div>

    <div class="controls">
        <button class="color-btn btn-cyan" onclick="changeColor('#0ff')"></button>
        <button class="color-btn btn-magenta" onclick="changeColor('#f0f')"></button>
        <button class="color-btn btn-green" onclick="changeColor('#0f0')"></button>
        <button class="color-btn btn-yellow" onclick="changeColor('#ff0')"></button>
        <button class="color-btn btn-orange" onclick="changeColor('#ff8c00')"></button>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }

        function changeColor(color) {
            document.documentElement.style.setProperty('--neon-color', color);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
