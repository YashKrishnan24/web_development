<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1f1c2c 0%, #928dab 100%);
        }

        .calculator {
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(15px);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
            width: 340px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .display {
            background: transparent;
            width: 100%;
            text-align: right;
            padding: 20px 10px;
            margin-bottom: 20px;
            border-radius: 15px;
            word-wrap: break-word;
            word-break: break-all;
        }

        .previous-operand {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
            min-height: 24px;
        }

        .current-operand {
            color: #fff;
            font-size: 3rem;
            font-weight: 500;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            border: none;
            outline: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #2d2d2d;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: -2px -2px 6px rgba(255,255,255,0.05), 
                        3px 3px 10px rgba(0,0,0,0.5);
        }

        button:active {
            transform: scale(0.92);
            box-shadow: inset -2px -2px 6px rgba(255,255,255,0.05), 
                        inset 3px 3px 10px rgba(0,0,0,0.5);
        }

        button.operator {
            color: #ff9f0a;
        }

        button.action {
            color: #ff4757;
        }

        button.equals {
            background: #ff9f0a;
            color: #fff;
            grid-column: span 2;
            width: 100%;
            border-radius: 30px;
        }

        button.zero {
            grid-column: span 2;
            width: 100%;
            border-radius: 30px;
            text-align: left;
            padding-left: 25px;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="display">
            <div class="previous-operand" id="previous"></div>
            <div class="current-operand" id="current">0</div>
        </div>
        <div class="buttons">
            <button class="action" onclick="clearDisplay()">AC</button>
            <button class="action" onclick="deleteNumber()">DEL</button>
            <button class="operator" onclick="appendOperator('%')">%</button>
            <button class="operator" onclick="appendOperator('/')">÷</button>

            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="appendOperator('*')">×</button>

            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="appendOperator('-')">−</button>

            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="appendOperator('+')">+</button>

            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const currentDisplay = document.getElementById('current');
        const previousDisplay = document.getElementById('previous');
        let currentInput = '0';
        let previousInput = '';
        let operation = undefined;
        let shouldResetScreen = false;

        function updateDisplay() {
            currentDisplay.innerText = currentInput;
            if (operation != null) {
                let opSymbol = operation;
                if (opSymbol === '*') opSymbol = '×';
                if (opSymbol === '/') opSymbol = '÷';
                if (opSymbol === '-') opSymbol = '−';
                previousDisplay.innerText = `${previousInput} ${opSymbol}`;
            } else {
                previousDisplay.innerText = '';
            }
        }

        function appendNumber(number) {
            if (currentInput === '0' && number !== '.') currentInput = '';
            if (shouldResetScreen) {
                currentInput = '';
                shouldResetScreen = false;
            }
            if (number === '.' && currentInput.includes('.')) return;
            currentInput = currentInput.toString() + number.toString();
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentInput === '' && op === '-') {
                currentInput = '-';
                updateDisplay();
                return;
            }
            if (currentInput === '' || currentInput === '-') return;
            if (previousInput !== '') {
                calculate();
            }
            operation = op;
            previousInput = currentInput;
            currentInput = '';
            updateDisplay();
        }

        function clearDisplay() {
            currentInput = '0';
            previousInput = '';
            operation = undefined;
            updateDisplay();
        }

        function deleteNumber() {
            if (currentInput === '0') return;
            currentInput = currentInput.toString().slice(0, -1);
            if (currentInput === '' || currentInput === '-') currentInput = '0';
            updateDisplay();
        }

        function calculate() {
            let computation;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '*':
                    computation = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        alert("Cannot divide by zero");
                        clearDisplay();
                        return;
                    }
                    computation = prev / current;
                    break;
                case '%':
                    computation = prev % current;
                    break;
                default:
                    return;
            }

            // Handle floating point precision issues (e.g., 0.1 + 0.2)
            currentInput = Math.round(computation * 100000000) / 100000000;
            operation = undefined;
            previousInput = '';
            shouldResetScreen = true;
            updateDisplay();
        }

        // Keyboard support
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9' || e.key === '.') appendNumber(e.key);
            if (e.key === '=' || e.key === 'Enter') calculate();
            if (e.key === 'Backspace') deleteNumber();
            if (e.key === 'Escape') clearDisplay();
            if (['+', '-', '*', '/', '%'].includes(e.key)) appendOperator(e.key);
        });
    </script>
</body>
</html>
