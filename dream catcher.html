<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Catcher</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0c0c0c, #1a1a2e, #16213e);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .dream-catcher {
            position: relative;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 2px solid #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dream {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            padding: 10px;
            font-size: 14px;
            text-align: center;
            opacity: 0;
            animation: float 8s infinite ease-in-out;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .dream:nth-child(1) { animation-delay: 0s; }
        .dream:nth-child(2) { animation-delay: 1s; }
        .dream:nth-child(3) { animation-delay: 2s; }
        .dream:nth-child(4) { animation-delay: 3s; }
        .dream:nth-child(5) { animation-delay: 4s; }
        .dream:nth-child(6) { animation-delay: 5s; }
        .dream:nth-child(7) { animation-delay: 6s; }
        .dream:nth-child(8) { animation-delay: 7s; }

        @keyframes float {
            0%, 100% { opacity: 0; transform: translateY(0) rotate(0deg); }
            25% { opacity: 1; transform: translateY(-50px) rotate(90deg); }
            50% { opacity: 1; transform: translateY(-100px) rotate(180deg); }
            75% { opacity: 1; transform: translateY(-50px) rotate(270deg); }
        }

        .center-text {
            position: absolute;
            text-align: center;
            z-index: 10;
        }

        .center-text h1 {
            font-size: 2em;
            margin: 0;
            text-shadow: 0 0 10px #00d4ff;
        }

        .center-text p {
            font-size: 1.2em;
            margin: 10px 0 0 0;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="dream-catcher">
        <div class="center-text">
            <h1>Dream Catcher</h1>
            <p>Catch your dreams as they float by...</p>
        </div>
        <div class="dream" id="dream1">Dream of flying high</div>
        <div class="dream" id="dream2">Explore hidden worlds</div>
        <div class="dream" id="dream3">Build amazing things</div>
        <div class="dream" id="dream4">Discover new passions</div>
        <div class="dream" id="dream5">Travel to distant lands</div>
        <div class="dream" id="dream6">Create beautiful art</div>
        <div class="dream" id="dream7">Learn something new</div>
        <div class="dream" id="dream8">Make a difference</div>
    </div>

    <script>
        // Function to generate random dreams
        function generateDream() {
            const dreams = [
                "Dream of endless possibilities",
                "Imagine a world without limits",
                "Chase the stars in your mind",
                "Unleash your inner creativity",
                "Find peace in the chaos",
                "Embrace the unknown",
                "Create your own reality",
                "Inspire others with your vision"
            ];
            return dreams[Math.floor(Math.random() * dreams.length)];
        }

        // Update dreams every 10 seconds
        setInterval(() => {
            const dreamElements = document.querySelectorAll('.dream');
            dreamElements.forEach((el, index) => {
                setTimeout(() => {
                    el.textContent = generateDream();
                }, index * 1000);
            });
        }, 10000);
    </script>
</body>
</html>
