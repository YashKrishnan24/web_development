<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presidents of India — A Living Legacy</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --saffron: #FF9933;
    --white: #F8F4EE;
    --green: #138808;
    --navy: #000080;
    --gold: #C9A84C;
    --dark: #0D0D0D;
    --card-bg: rgba(255,255,255,0.04);
    --line: rgba(201,168,76,0.3);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: #080810;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
    cursor: none;
  }

  /* Custom cursor */
  .cursor {
    width: 12px; height: 12px;
    background: var(--saffron);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s, width 0.3s, height 0.3s, background 0.3s;
    mix-blend-mode: screen;
  }
  .cursor-trail {
    width: 36px; height: 36px;
    border: 1px solid rgba(201,168,76,0.5);
    border-radius: 50%;
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: left 0.15s ease, top 0.15s ease;
  }
  body:hover .cursor { opacity: 1; }

  /* Noise overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 1; opacity: 0.4;
  }

  /* Header */
  header {
    position: relative;
    text-align: center;
    padding: 90px 20px 60px;
    overflow: hidden;
  }
  .chakra-bg {
    position: absolute;
    width: 600px; height: 600px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.04;
    animation: spin 60s linear infinite;
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  .flag-stripe {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; height: 5px;
  }
  .flag-stripe span:nth-child(1) { flex: 1; background: var(--saffron); }
  .flag-stripe span:nth-child(2) { flex: 1; background: var(--white); }
  .flag-stripe span:nth-child(3) { flex: 1; background: var(--green); }

  .header-eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px; letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 18px;
    opacity: 0;
    animation: fadeUp 1s 0.3s forwards;
  }
  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(44px, 7vw, 92px);
    font-weight: 900;
    line-height: 1.0;
    background: linear-gradient(135deg, var(--saffron) 0%, var(--gold) 40%, var(--white) 70%, var(--green) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
    animation: fadeUp 1s 0.5s forwards;
  }
  .header-sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 20px;
    color: rgba(248,244,238,0.5);
    margin-top: 16px;
    opacity: 0;
    animation: fadeUp 1s 0.7s forwards;
  }
  .header-meta {
    display: flex; justify-content: center; gap: 40px;
    margin-top: 40px;
    opacity: 0;
    animation: fadeUp 1s 0.9s forwards;
  }
  .meta-item {
    text-align: center;
  }
  .meta-num {
    font-family: 'Playfair Display', serif;
    font-size: 36px; font-weight: 700;
    color: var(--saffron);
  }
  .meta-label {
    font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(248,244,238,0.4);
    margin-top: 4px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Filter bar */
  .filter-bar {
    display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
    padding: 20px 20px 40px;
    position: relative; z-index: 2;
  }
  .filter-btn {
    padding: 8px 22px;
    border-radius: 100px;
    border: 1px solid rgba(201,168,76,0.3);
    background: transparent;
    color: rgba(248,244,238,0.6);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    cursor: none;
    transition: all 0.3s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--gold);
    color: var(--dark);
    border-color: var(--gold);
    transform: translateY(-2px);
  }

  /* Search */
  .search-wrap {
    display: flex; justify-content: center;
    padding: 0 20px 50px;
  }
  .search-box {
    width: 100%; max-width: 420px;
    padding: 12px 24px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 100px;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .search-box::placeholder { color: rgba(248,244,238,0.3); }
  .search-box:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
  }

  /* Timeline */
  .timeline {
    position: relative;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 100px;
  }
  .timeline::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0; bottom: 0;
    width: 1px;
    background: linear-gradient(to bottom, transparent, var(--gold) 10%, var(--gold) 90%, transparent);
    transform: translateX(-50%);
    opacity: 0.25;
  }

  .timeline-item {
    display: flex;
    justify-content: flex-end;
    padding-right: calc(50% + 40px);
    margin-bottom: 64px;
    opacity: 0;
    transform: translateX(-40px);
    transition: opacity 0.7s, transform 0.7s;
    position: relative;
  }
  .timeline-item.right {
    justify-content: flex-start;
    padding-right: 0;
    padding-left: calc(50% + 40px);
    transform: translateX(40px);
  }
  .timeline-item.visible {
    opacity: 1;
    transform: translateX(0);
  }

  /* Center dot */
  .timeline-item::after {
    content: attr(data-num);
    position: absolute;
    left: 50%; top: 28px;
    transform: translateX(-50%);
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--dark);
    border: 2px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    color: var(--gold);
    z-index: 3;
    transition: background 0.3s, transform 0.3s;
  }
  .timeline-item:hover::after {
    background: var(--gold);
    color: var(--dark);
    transform: translateX(-50%) scale(1.2);
  }

  /* Card */
  .pres-card {
    width: 100%; max-width: 440px;
    background: var(--card-bg);
    border: 1px solid rgba(201,168,76,0.12);
    border-radius: 16px;
    padding: 28px;
    position: relative;
    overflow: hidden;
    cursor: none;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), border-color 0.3s, box-shadow 0.3s;
    backdrop-filter: blur(10px);
  }
  .pres-card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,153,51,0.05) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.4s;
  }
  .pres-card:hover {
    transform: translateY(-6px) scale(1.015);
    border-color: rgba(201,168,76,0.4);
    box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 40px rgba(255,153,51,0.06);
  }
  .pres-card:hover::before { opacity: 1; }

  .card-accent {
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--saffron), var(--gold), var(--green));
    opacity: 0;
    transition: opacity 0.3s;
    border-radius: 16px 16px 0 0;
  }
  .pres-card:hover .card-accent { opacity: 1; }

  .card-top {
    display: flex; align-items: flex-start; gap: 16px;
    margin-bottom: 18px;
  }
  .avatar {
    width: 64px; height: 64px; min-width: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,153,51,0.2), rgba(19,136,8,0.2));
    border: 2px solid rgba(201,168,76,0.3);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 700;
    color: var(--gold);
    transition: border-color 0.3s, transform 0.3s;
    flex-shrink: 0;
  }
  .pres-card:hover .avatar {
    border-color: var(--gold);
    transform: rotate(-5deg) scale(1.1);
  }
  .card-info { flex: 1; min-width: 0; }
  .pres-name {
    font-family: 'Playfair Display', serif;
    font-size: 20px; font-weight: 700;
    color: var(--white);
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .pres-tenure {
    font-size: 12px; letter-spacing: 1px;
    color: var(--gold);
    text-transform: uppercase;
  }
  .pres-party {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 10px;
    border-radius: 100px;
    font-size: 10px; letter-spacing: 1px;
    text-transform: uppercase;
    background: rgba(201,168,76,0.1);
    color: var(--gold);
    border: 1px solid rgba(201,168,76,0.2);
  }

  .pres-bio {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px; line-height: 1.7;
    color: rgba(248,244,238,0.65);
    margin-bottom: 16px;
    font-style: italic;
  }

  .impacts-label {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(248,244,238,0.3);
    margin-bottom: 10px;
  }
  .impacts {
    display: flex; flex-direction: column; gap: 6px;
  }
  .impact-item {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 13px;
    color: rgba(248,244,238,0.75);
    line-height: 1.5;
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.02);
    border-left: 2px solid transparent;
    transition: border-color 0.3s, background 0.3s, transform 0.3s;
  }
  .pres-card:hover .impact-item {
    border-left-color: var(--saffron);
    background: rgba(255,153,51,0.04);
    transform: translateX(4px);
  }
  .pres-card:hover .impact-item:nth-child(2) { transition-delay: 0.04s; }
  .pres-card:hover .impact-item:nth-child(3) { transition-delay: 0.08s; }
  .impact-dot {
    color: var(--saffron); font-size: 16px;
    margin-top: -1px; flex-shrink: 0;
  }

  .card-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 18px; padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .duration-badge {
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 700;
    color: rgba(255,153,51,0.5);
    transition: color 0.3s;
  }
  .pres-card:hover .duration-badge { color: var(--saffron); }
  .duration-label { font-size: 10px; color: rgba(248,244,238,0.3); }
  .role-badge {
    padding: 4px 14px;
    border-radius: 100px;
    font-size: 11px;
    border: 1px solid rgba(19,136,8,0.4);
    color: rgba(19,136,8,0.8);
    background: rgba(19,136,8,0.05);
    letter-spacing: 0.5px;
  }
  .role-badge.acting {
    border-color: rgba(201,168,76,0.4);
    color: rgba(201,168,76,0.8);
    background: rgba(201,168,76,0.05);
  }

  .no-results {
    text-align: center; padding: 80px 20px;
    color: rgba(248,244,238,0.3);
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px; font-style: italic;
  }

  /* Scroll hint */
  .scroll-hint {
    text-align: center;
    padding: 0 0 50px;
    animation: bob 2s ease-in-out infinite;
    opacity: 0.4;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--gold);
  }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(6px)} }

  /* Year ribbon */
  .year-ribbon {
    display: flex; justify-content: center;
    margin: 32px 0 16px;
    position: relative; z-index: 2;
  }
  .year-pill {
    padding: 6px 24px;
    border-radius: 100px;
    border: 1px solid rgba(201,168,76,0.25);
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: var(--gold);
    background: rgba(8,8,16,0.8);
    letter-spacing: 2px;
  }

  /* Progress bar */
  .progress-bar {
    position: fixed; top: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--saffron), var(--gold), var(--green));
    z-index: 100;
    transition: width 0.1s;
  }

  @media(max-width: 768px) {
    .timeline::before { left: 20px; }
    .timeline-item, .timeline-item.right {
      padding-left: 60px; padding-right: 0;
      justify-content: flex-start;
    }
    .timeline-item::after { left: 20px; }
    .header-meta { gap: 24px; }
    .meta-num { font-size: 28px; }
  }
</style>
</head>

<header>
  <div class="flag-stripe"><span></span><span></span><span></span></div>
  <div class="header-eyebrow">Republic of India · Since 1950</div>
  <h1 class="header-title">Guardians<br>of the Republic</h1>
  <p class="header-sub">A chronicle of every President who shaped the world's largest democracy</p>

</header>

<div class="search-wrap">

const timeline = document.getElementById('timeline');

function getInitials(name) {
  return name.split(' ').filter(w => w.length > 2).map(w => w[0]).slice(0, 2).join('');
}

function calcDuration(tenure) {
  if (tenure.includes('Acting') || tenure.includes('Jul') || tenure.includes('Feb')) return null;
  return null;
}

function buildCard(p, idx) {
  const isRight = idx % 2 === 1;
  const isActing = p.acting;
  const div = document.createElement('div');
  div.className = `timeline-item ${isRight ? 'right' : ''}`;
  div.setAttribute('data-num', p.num);
  div.setAttribute('data-era', p.era || '');
  div.setAttribute('data-acting', isActing ? 'true' : 'false');
  div.setAttribute('data-name', p.name.toLowerCase());
  div.setAttribute('data-bio', (p.bio + ' ' + p.impacts.join(' ')).toLowerCase());

  const impactsHTML = p.impacts.map(i =>
    `<div class="impact-item"><span class="impact-dot">◆</span><span>${i}</span></div>`
  ).join('');

  div.innerHTML = `
    <div class="pres-card">
      <div class="card-accent"></div>
      <div class="card-top">
        <div class="avatar">${getInitials(p.name)}</div>
        <div class="card-info">
          <div class="pres-name">${p.name}</div>
          <div class="pres-tenure">${p.tenure}</div>
          <span class="pres-party">${p.party}</span>
        </div>
      </div>
      <p class="pres-bio">${p.bio}</p>
      <div class="impacts-label">Key Impacts</div>
      <div class="impacts">${impactsHTML}</div>
      <div class="card-footer">
        <div>
          <div class="duration-badge">${p.years}</div>
          <div class="duration-label">in office</div>
        </div>
        <div class="role-badge ${isActing ? 'acting' : ''}">${isActing ? 'Acting President' : 'President'}</div>
      </div>
    </div>
  `;
  return div;
}

function render(list) {
  timeline.innerHTML = '';
  if (list.length === 0) {
    timeline.innerHTML = '<div class="no-results">No presidents found matching your search.</div>';
    return;
  }

  let lastEra = null;
  list.forEach((p, idx) => {
    const eraLabel = { '1950': '1950 — 1969', '1970': '1970 — 1999', '2000': '2000 — Present' };
    if (p.era && p.era !== lastEra && !p.acting) {
      lastEra = p.era;
      const ribbon = document.createElement('div');
      ribbon.className = 'year-ribbon';
      ribbon.innerHTML = `<div class="year-pill">${eraLabel[p.era]}</div>`;
      timeline.appendChild(ribbon);
    }
    timeline.appendChild(buildCard(p, idx));
  });

  // Intersection observer
  const items = timeline.querySelectorAll('.timeline-item');
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: 0.1 });
  items.forEach(i => observer.observe(i));
}

// Filtering
let currentFilter = 'all';
let currentSearch = '';

function applyFilters() {
  let list = presidents;
  if (currentFilter === 'acting') {
    list = list.filter(p => p.acting);
  } else if (currentFilter !== 'all') {
    list = list.filter(p => p.era === currentFilter && !p.acting);
  }
  if (currentSearch) {
    list = list.filter(p =>
      p.name.toLowerCase().includes(currentSearch) ||
      p.bio.toLowerCase().includes(currentSearch) ||
      p.impacts.some(i => i.toLowerCase().includes(currentSearch)) ||
      p.tenure.includes(currentSearch)
    );
  }
  render(list);
  document.getElementById('countNum').textContent = list.length;
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilters();
  });
});

document.getElementById('searchBox').addEventListener('input', e => {
  currentSearch = e.target.value.toLowerCase().trim();
  applyFilters();
});

// Scroll progress
window.addEventListener('scroll', () => {
  const scrolled = window.scrollY / (document.documentElement.scrollHeight - window.innerHeight);
  document.getElementById('progressBar').style.width = (scrolled * 100) + '%';
});

// Custom cursor
const cursor = document.getElementById('cursor');
const trail = document.getElementById('cursorTrail');
let tx = 0, ty = 0;
document.addEventListener('mousemove', e => {
  tx = e.clientX; ty = e.clientY;
  cursor.style.left = tx + 'px';
  cursor.style.top = ty + 'px';
  setTimeout(() => {
    trail.style.left = tx + 'px';
    trail.style.top = ty + 'px';
  }, 80);
});

// Initial render
render(presidents);
</script>
